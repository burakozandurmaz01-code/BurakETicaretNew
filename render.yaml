services:
  - type: web
    name: burak-eticaret
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: burak-eticaret-db
          property: connectionString

databases:
  - name: burak-eticaret-db
    databaseName: burak_eticaret
    user: burak_eticaret
    plan: free
